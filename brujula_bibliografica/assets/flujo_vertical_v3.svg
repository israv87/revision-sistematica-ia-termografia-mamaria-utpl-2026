<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 424" role="img" aria-labelledby="title desc">
  <title id="title">Ruta de los registros</title>
  <desc id="desc">629 registros de Scopus más 264 de Web of Science dan 893 registros reunidos. Se retiran 227 duplicados. La base final contiene aproximadamente 670 artículos únicos.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102d43"/><stop offset="1" stop-color="#124c54"/></linearGradient>
    <linearGradient id="final" x2="0" y2="1"><stop stop-color="#39b99a"/><stop offset="1" stop-color="#188d83"/></linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#92d6d4"/></marker>
  </defs>
  <rect width="360" height="424" rx="18" fill="url(#bg)"/>
  <text x="20" y="29" fill="#a9dcda" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">RUTA DE LOS REGISTROS</text>
  <rect x="20" y="45" width="149" height="64" rx="11" fill="#8b482f" stroke="#e8a078" stroke-opacity=".65"/>
  <text x="34" y="74" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">629</text>
  <text x="34" y="95" fill="#f5d4c5" font-family="Segoe UI,Arial,sans-serif" font-size="13">Scopus</text>
  <rect x="191" y="45" width="149" height="64" rx="11" fill="#2b5480" stroke="#9bc5eb" stroke-opacity=".65"/>
  <text x="205" y="74" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">264</text>
  <text x="205" y="95" fill="#d8eafa" font-family="Segoe UI,Arial,sans-serif" font-size="12">Web of Science</text>
  <path d="M95 109 V126 H180 V142 M265 109 V126 H180" fill="none" stroke="#92d6d4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="64" y="151" width="232" height="64" rx="13" fill="#1c6e76" stroke="#72cecb" stroke-opacity=".65"/>
  <text x="82" y="190" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">893</text>
  <text x="155" y="189" fill="#d3eeee" font-family="Segoe UI,Arial,sans-serif" font-size="13">registros reunidos</text>
  <path d="M180 215 V234" fill="none" stroke="#92d6d4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="64" y="243" width="232" height="64" rx="13" fill="#214c60" stroke="#82cad4" stroke-opacity=".6"/>
  <text x="82" y="281" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">−227</text>
  <text x="160" y="280" fill="#cde7ed" font-family="Segoe UI,Arial,sans-serif" font-size="12">duplicados retirados</text>
  <path d="M180 307 V326" fill="none" stroke="#92d6d4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="64" y="335" width="232" height="66" rx="13" fill="url(#final)" stroke="#b6ffe8" stroke-opacity=".7"/>
  <text x="82" y="359" fill="#edfff9" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">TOTAL FINAL</text>
  <text x="82" y="386" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">≈670</text>
  <text x="175" y="384" fill="#edfff9" font-family="Segoe UI,Arial,sans-serif" font-size="13">artículos únicos</text>
  <text x="25" y="416" fill="#99bfc4" font-family="Segoe UI,Arial,sans-serif" font-size="10">Total redondeado; conteo exacto en el archivo.</text>
</svg>
